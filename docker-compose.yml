services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lecturer_tracker_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lecturer_github_tracker}
    ports:
      - "3306:3306"
    volumes:
      - lecturer_tracker_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-lecturer_tracker_password}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lecturer_tracker_mysql:
